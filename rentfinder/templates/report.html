<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>باحث عقارات الرياض</title>
<style>
:root{--ink:#17212b;--muted:#667582;--bg:#edf3f2;--paper:#fff;--line:#d7e1df;--brand:#087f78;--brand2:#065b58;--danger:#b42318;--shadow:0 18px 45px #163c3814}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e7f2ef,#f7f9f6 55%,#e8f0f3);color:var(--ink);font:16px/1.55 "Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif}main{max-width:1180px;margin:auto;padding:28px 18px 70px}header{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}h1{font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.15;margin:0 0 7px;letter-spacing:0}.eyebrow{color:var(--brand);font-weight:800;font-size:.8rem;letter-spacing:.08em}.lead{color:var(--muted);margin:0}.mark{width:58px;height:58px;border-radius:16px;background:var(--brand);color:white;display:grid;place-items:center;font-size:1.7rem;box-shadow:var(--shadow)}.panel{background:#ffffffd9;border:1px solid #fff;border-radius:18px;box-shadow:var(--shadow);padding:20px;margin-bottom:18px}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}label{display:grid;gap:5px;color:var(--muted);font-size:.82rem;font-weight:700}input,select,button{font:inherit}input,select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}.wide{grid-column:span 2}.actions{display:flex;align-items:center;gap:12px;margin-top:16px}.primary{border:0;border-radius:11px;background:var(--brand);color:white;padding:11px 22px;font-weight:800;cursor:pointer}.primary:hover{background:var(--brand2)}.primary:disabled{opacity:.6;cursor:wait}.status{color:var(--muted);font-size:.9rem}.error{color:var(--danger);background:#fff1f0;border:1px solid #ffd1cc;border-radius:10px;padding:10px;margin-top:14px}.summary{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.pill{border:1px solid var(--line);border-radius:99px;background:var(--paper);padding:5px 11px;font-size:.83rem;color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:12px;margin-bottom:12px}table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{text-align:start;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.8rem;color:var(--muted);white-space:nowrap}td.title{font-weight:700;min-width:220px}a{color:var(--brand2)}.open{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;padding:6px 10px;border-radius:8px;font-size:.87rem;font-weight:700;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:34px}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;vertical-align:-3px;animation:spin .7s linear infinite;margin-inline-end:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:850px){.filters{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}header{align-items:start}.mark{display:none}}@media(max-width:620px){main{padding:18px 12px 45px}.panel{padding:14px;border-radius:14px}.filters,.toolbar{grid-template-columns:1fr}.wide{grid-column:auto}table,thead,tbody,tr,th,td{display:block;width:100%}thead{display:none}tr{padding:8px 0;border-bottom:7px solid var(--bg)}td{display:flex;justify-content:space-between;gap:12px;padding:5px 10px;border:0;text-align:end}td:before{content:attr(data-label);color:var(--muted);font-size:.78rem}td.title{display:block;text-align:start}td.title:before{display:none}td.action{display:block;text-align:start;margin-top:4px}.open{width:100%;text-align:center}}
</style></head>
<body><main>
<header><div><div class="eyebrow">RIYADH PROPERTY SEARCH</div><h1>ابحث عن منزلك في الرياض</h1><p class="lead">نتائج مباشرة من منصات العقار العامة، في شاشة واحدة.</p></div><div class="mark" aria-hidden="true">⌂</div></header>
<section class="panel"><form id="form"><div class="filters">
<label>أقصى إيجار سنوي (ريال)<input id="max" type="number" min="1" value="40000" required></label>
<label>أدنى إيجار سنوي<input id="min" type="number" min="0" value="0"></label>
<label>نوع العقار<select id="type"><option>الكل</option><option>شقق</option><option>استراحات</option><option>شاليهات</option><option>مخيمات</option></select></label>
<label>فترة الإيجار<select id="period"><option>الكل</option><option>سنوي</option><option>شهري</option></select></label>
<label>مصدر البحث<select id="source"><option value="الكل">كل المنصات</option><option>بيوت</option><option>عقار</option><option>وصلت</option><option>حراج</option><option>ديل</option></select></label>
<label>عدد الصفحات<input id="pages" type="number" min="1" max="25" value="1"></label>
<label class="wide">الأحياء أو المناطق (اختياري)<input id="districts" placeholder="مثال: الرمال، الياسمين"></label>
</div><div class="actions"><button class="primary" id="search" type="submit">بحث الآن</button><span class="status" id="status" aria-live="polite"></span></div><div class="error" id="error" hidden></div></form></section>
<section class="panel" id="results" hidden><div class="summary" id="summary"></div><div class="toolbar"><input id="query" type="search" placeholder="تصفية النتائج بالعنوان أو الحي"><select id="sort"><option value="new">الأحدث</option><option value="cheap">الأرخص</option><option value="expensive">الأغلى</option><option value="area">الأكبر مساحة</option></select></div><div style="overflow:auto"><table><thead><tr><th>العقار</th><th>السعر السنوي</th><th>الحي</th><th>المصدر</th><th>المساحة</th><th>الرابط</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script id="data" type="application/json">__DATA__</script><script>
const $=id=>document.getElementById(id),nf=new Intl.NumberFormat('ar-SA-u-nu-latn');let data=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=$('query').value.trim().toLowerCase(),sort=$('sort').value;let rows=(data?.listings||[]).filter(r=>(r.title+' '+r.hood).toLowerCase().includes(q));rows.sort((a,b)=>sort==='cheap'?a.annual-b.annual:sort==='expensive'?b.annual-a.annual:sort==='area'?(b.area||0)-(a.area||0):0);$('rows').innerHTML=rows.length?rows.map(r=>`<tr><td class="title">${esc(r.title||'إعلان بدون عنوان')}</td><td data-label="السعر">${nf.format(r.annual)} ريال${r.period==='monthly'?`<small> ${nf.format(r.price)} شهرياً</small>`:''}</td><td data-label="الحي">${esc(r.hood||'غير محدد')}</td><td data-label="المصدر">${esc(data.labels[r.source]||r.source)}</td><td data-label="المساحة">${r.area?nf.format(r.area)+' م²':'-'}</td><td class="action"><a class="open" href="${esc(r.url)}" target="_blank" rel="noopener">فتح الإعلان</a></td></tr>`).join(''):'<tr><td class="empty" colspan="6">لا توجد نتائج مطابقة. وسّع السعر أو غيّر المصدر.</td></tr>';$('summary').innerHTML=`<span class="pill">${nf.format(rows.length)} نتيجة</span><span class="pill">تم فحص ${nf.format(data.stats.seen)} إعلان</span>`+(data.stats.partial?'<span class="pill">نتائج جزئية</span>':'');}
async function search(e){e.preventDefault();$('error').hidden=true;$('search').disabled=true;$('search').innerHTML='<span class="spinner"></span>جاري البحث';$('status').textContent='قد يستغرق البحث دقيقة بسبب حماية المواقع';$('results').hidden=true;try{const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max_price:+$('max').value,min_price:+$('min').value,types:$('type').value,period:$('period').value,sources:[$('source').value],districts:$('districts').value,pages:+$('pages').value})});const body=await r.json();if(!r.ok)throw Error(body.detail||'تعذر تنفيذ البحث');data=body;$('results').hidden=false;render();$('status').textContent='اكتمل البحث';}catch(err){$('error').textContent=err.message;$('error').hidden=false;$('status').textContent='';}finally{$('search').disabled=false;$('search').textContent='بحث الآن';}}
$('form').addEventListener('submit',search);$('query').addEventListener('input',render);$('sort').addEventListener('change',render);
try{const raw=$('data').textContent.trim();if(raw&&raw!=='__DATA__'){data=JSON.parse(raw);$('results').hidden=false;render();}}catch(e){}
</script></body></html>
